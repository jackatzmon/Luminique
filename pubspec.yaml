name: luminique
description: DJ Event Photo Stream App - QR-based guest photo upload system for DJ events and parties
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.1

  # Image Handling
  image_picker: ^1.0.7
  image_compression_flutter: ^1.0.4

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  archive: ^3.4.10

  # Network & HTTP
  http: ^1.2.0
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.4

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Luminique
      fonts:
        - asset: assets/fonts/Luminique-Regular.ttf
        - asset: assets/fonts/Luminique-Bold.ttf
          weight: 700
