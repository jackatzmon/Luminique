name: luminique
description: DJ Event Photo Stream App - QR-based guest photo upload system for DJ events and parties
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7

  # State Management
  provider: ^6.1.2

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

  # Image Handling
  image_picker: ^1.1.2
  image_compression_flutter: ^1.0.4

  # QR Code
  qr_flutter: ^4.1.0

  # File Handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  archive: ^4.0.2

  # Network & HTTP
  http: ^1.2.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

  # Local Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Luminique
      fonts:
        - asset: assets/fonts/Luminique-Regular.ttf
        - asset: assets/fonts/Luminique-Bold.ttf
          weight: 700
